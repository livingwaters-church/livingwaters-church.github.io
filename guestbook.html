<div class="container">
    <h2>Sign Our Guestbook</h2>
    <form id="guestbook-form">
        <input type="text" id="guest-name" class="input-field" placeholder="Your Name" required>
        <textarea id="guest-note" class="input-field" placeholder="Leave a note..." rows="4"></textarea>
        <button type="submit" class="btn-nav-sign-in" style="width: 100%; border: none; cursor: pointer;">Submit</button>
    </form>
</div>

<script>
    document.getElementById('guestbook-form').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Thank you for signing our guestbook!');
        window.location.href = 'index.html';
    });
</script>
