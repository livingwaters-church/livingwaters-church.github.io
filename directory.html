<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Member Directory - Living Waters Community Church</title>
    <!-- Link to your main stylesheet (adjust relative path if needed, e.g., assets/style.css) -->
    <link rel="stylesheet" href="style.css?v=1">
</head>
<body>

    <!-- Global Navigation Header (Assuming you use a script or shared layout for this, otherwise include your nav HTML here) -->
    <div id="global-header"></div>

    <!-- Main Content Section -->
    <main style="padding: 60px 20px; text-align: center; min-height: 60vh;">
        <div style="max-width: 700px; margin: 0 auto;">
            
            <h2 style="color: #1a2b4c; font-size: 2em; margin-bottom: 10px;">Community Member Directory</h2>
            <p style="color: #555; font-size: 1.1em; margin-bottom: 30px;">Meet the wonderful people that make up our church family.</p>

            <!-- Members Only Box -->
            <div style="border: 2px dashed #cbd5e1; border-radius: 12px; padding: 40px 20px; background-color: #f8fafc;">
                <h3 style="color: #1e293b; margin-top: 0; font-size: 1.4em;">Members Only</h3>
                <p style="color: #475569; margin-bottom: 20px;">This directory is private. Please sign in to view your church family.</p>
                <a href="login.html" style="display: inline-block; background-color: #0284c7; color: white; padding: 10px 25px; text-decoration: none; border-radius: 6px; font-weight: bold;">
                    Sign In
                </a>
            </div>

        </div>
    </main>

    <!-- Global Footer Container -->
    <div id="global-footer"></div>

    <!-- Scripts for Header and Footer -->
    <script src="footer.js"></script>
</body>
</html>
