<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Living Waters Community Church</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .reset-container { max-width: 400px; margin: 60px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 5px solid #f59e0b; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #0f172a; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
        .btn-action { display: block; width: 100%; padding: 12px; background: #0f172a; color: #fff; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

<nav style="margin-bottom: 20px; text-align: center; padding-top: 20px;">
    <a href="login.html" style="color: #64748b; text-decoration: none;">&larr; Back to Sign In</a>
</nav>

<div class="reset-container">
    <h3 style="color: #0f172a; margin-top: 0;">Reset Password</h3>
    <p style="color: #475569; font-size: 0.9em; margin-bottom: 20px;">Verify your identity to update your password.</p>

    <!-- Step 1: Verification Form -->
    <form id="verifyForm" onsubmit="verifyMember(event)">
        <div class="form-group">
            <label>First and Last Name</label>
            <input type="text" id="resetName" required placeholder="e.g. John Doe">
        </div>
        <div class="form-group">
            <label>Security PIN or Phone Number on File</label>
            <input type="text" id="resetSecurity" required placeholder="Enter verification PIN/Phone">
        </div>
        <button type="submit" class="btn-action">Verify Identity</button>
    </form>

    <!-- Step 2: New Password Form (Initially Hidden) -->
    <form id="newPasswordForm" class="hidden" onsubmit="saveNewPassword(event)">
        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPass" required placeholder="Enter new password">
        </div>
        <button type="submit" class="btn-action" style="background: #0284c7;">Update Password</button>
    </form>

    <p id="reset-msg" style="color: red; font-size: 0.85em; margin-top: 15px; text-align: center;"></p>
</div>

<script>
    function verifyMember(event) {
        event.preventDefault();
        const name = document.getElementById('resetName').value.trim();
        const security = document.getElementById('resetSecurity').value.trim();
        const msg = document.getElementById('reset-msg');

        // Note: In a production static setup, you can cross-reference your 
        // LWCC_Golden_Master.csv data array here. For this demo flow, we simulate validation:
        if (name !== "" && security !== "") {
            // Hide step 1, show step 2
            document.getElementById('verifyForm').classList.add('hidden');
            document.getElementById('newPasswordForm').classList.remove('hidden');
            msg.style.color = "green";
            msg.textContent = "Identity verified! Please set your new password.";
        } else {
            msg.style.color = "red";
            msg.textContent = "Please fill out all verification fields.";
        }
    }

    function saveNewPassword(event) {
        event.preventDefault();
        const newPass = document.getElementById('newPass').value;
        const msg = document.getElementById('reset-msg');

        if (newPass.length >= 6) {
            // Save the new password locally so handleLogin can check it
            localStorage.setItem('lwcc_current_password', newPass);
            localStorage.setItem('lwcc_password_reset', 'success');
            
            msg.style.color = "green";
            msg.textContent = "Password updated successfully! Redirecting to login...";
            
            setTimeout(() => {
                window.location.href = "login.html";
            }, 2000);
        } else {
            msg.style.color = "red";
            msg.textContent = "Password must be at least 6 characters long.";
        }
    }
</script>

</body>
</html>
